[project]
name = "ansible-monitoring"
version = "0.1.0"
description = "Ansible playbook to setup BAR monitoring"
requires-python = ">=3.13"

[project.scripts]
sync-collections = "sync_collections:main"

[dependency-groups]
dev = ["ansible-core==2.21.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["scripts/sync_collections.py"]
sources = {"scripts" = ""}
